name: CI

# 每次 push（任意分支）和 PR 时：格式检查、vet、编译、单元测试，外加四个发布平台的交叉编译。
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test
        id: test
        shell: bash
        run: go test -race ./... 2>&1 | tee "$RUNNER_TEMP/test.log"
      # 把失败的用例和断言行汇成一条注解，在检查页面上直接可见，不必翻日志。
      - name: annotate test failures
        if: failure() && steps.test.outcome == 'failure'
        shell: bash
        run: |
          msg=$(grep -E -- '--- FAIL|FAIL\s|_test\.go:[0-9]+:|panic:' \
            "$RUNNER_TEMP/test.log" | head -60 || true)
          msg=${msg//'%'/'%25'}
          msg=${msg//$'\r'/'%0D'}
          msg=${msg//$'\n'/'%0A'}
          echo "::error title=go test failed::${msg:-see log}"

  cross-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: build release binaries
        run: bash scripts/build-release.sh "ci-${GITHUB_SHA::7}"
